<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hera rail — navigation feel (Option C)</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#11151f; --panel2:#0e1220; --border:#1e2430;
    --txt:#cfd6e4; --dim:#5b657a; --proj:#7aa2f7; --coord:#cde2ff;
    --sel:#1b2740; --selbar:#3d6fd6; --live:#7dcfff; --idle:#4a5468;
    --attn:#faa378; --green:#9ece6a; --pill:#1f2a44; --pilltx:#8fb0ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:13px/1.5 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh}
  .topbar{height:30px;display:flex;align-items:center;padding:0 14px;color:#fff;
    border-bottom:1px solid var(--border);background:var(--panel2);letter-spacing:1px;font-weight:600;gap:12px}
  .topbar .hint{color:var(--dim);font-weight:400;letter-spacing:.3px;font-size:11.5px}
  .wrap{flex:1;display:flex;min-height:0}
  /* rail */
  .rail{width:320px;flex:0 0 320px;border-right:1px solid var(--border);background:var(--panel);
    overflow-y:auto;outline:none}
  .railhdr{padding:6px 12px;border-bottom:1px solid var(--border);color:var(--dim);
    font-size:11px;letter-spacing:1px;text-transform:uppercase;background:var(--panel2);position:sticky;top:0}
  .rows{padding:6px 0}
  .row{display:flex;align-items:center;padding:3px 12px 3px 0;cursor:pointer;white-space:nowrap;position:relative}
  .row:hover{background:#141a28}
  .row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--selbar)}
  .chev{width:16px;flex:0 0 16px;text-align:center;color:var(--dim)}
  .chev.leaf{visibility:hidden}
  .icon{width:18px;flex:0 0 18px;text-align:center}
  .icon.live{color:var(--live)} .icon.idle{color:var(--idle)}
  .icon.attn{color:var(--attn);font-weight:700} .icon.proj{color:var(--proj)}
  .name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
  .name.proj{color:var(--proj);font-weight:600}
  .name.coord{color:var(--coord)}
  .count{color:var(--dim);margin-left:6px}
  .pill{font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--pilltx);
    background:var(--pill);border:1px solid #2a3a5e;border-radius:9px;padding:0 6px;margin-left:8px;flex:0 0 auto}
  .elapsed{color:var(--dim);margin-left:8px;flex:0 0 auto;font-size:11.5px}
  .sep{padding:5px 12px;color:var(--dim);font-size:11px;display:flex;align-items:center;gap:8px}
  .sep .line{flex:1;border-top:1px solid var(--border)}
  /* body / panes */
  .body{flex:1;display:flex;min-width:0;background:var(--bg)}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
  .pane:last-child{border-right:none}
  .pane .ph{padding:5px 12px;border-bottom:1px solid var(--border);background:var(--panel2);
    display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11.5px}
  .pane .ph .tag{color:#fff;font-weight:600;letter-spacing:.5px}
  .pane .ph .role{color:var(--dim)}
  .pane .ph .st{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .st.working{color:var(--green)} .st.idle{color:var(--idle)} .st.attn{color:var(--attn)}
  .term{flex:1;padding:12px 14px;overflow:auto;white-space:pre-wrap;font-size:12.5px;line-height:1.55;color:#b9c2d4}
  .term .u{color:var(--proj)} .term .a{color:#e6edf7} .term .d{color:var(--dim)}
  .term .ok{color:var(--green)} .term .warn{color:var(--attn)}
  .cursor{display:inline-block;width:7px;height:15px;background:#7dcfff;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--idle);font-size:12px}
  .bottombar{height:28px;display:flex;align-items:center;gap:18px;padding:0 14px;
    border-top:1px solid var(--border);background:var(--panel2);color:var(--dim);font-size:11.5px}
  .bottombar b{color:var(--txt);font-weight:600}
  .bottombar .mode{color:var(--green);font-weight:600;letter-spacing:.5px}
  .bottombar .mode.solo{color:var(--proj)}
  kbd{background:#1a2030;border:1px solid #2a3450;border-radius:4px;padding:0 5px;color:#cdd6e6;font-size:11px}
</style>
</head>
<body>
  <div class="topbar">HERA <span class="hint">— <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>space</kbd> fold coord · select a coord → full-width · select an agent → coord+agent</span></div>
  <div class="wrap">
    <div class="rail" id="rail" tabindex="0"><div class="railhdr">Rail</div><div class="rows" id="rows"></div></div>
    <div class="body" id="bodyEl"></div>
  </div>
  <div class="bottombar" id="bottom"></div>

<script>
// ---------------------------------------------------------------- model
// kind: 'coord' (expandable node / project root or sub-coord) | 'leaf' (worker)
const projects = [
  { id:'co', name:'checkout-rebuild', kind:'coord', root:true, task:'checkout-coord', live:true, status:'working',
    children:[
      { id:'w1', name:'wave-1', kind:'coord', task:'wave-1', live:true, status:'working',
        children:[
          { id:'cart-api', name:'cart-api', kind:'leaf', task:'cart-api', live:true, status:'attn', attn:true, elapsed:'12m' },
          { id:'cart-ui',  name:'cart-ui',  kind:'leaf', task:'cart-ui',  live:true, status:'working', elapsed:'4m' },
        ]},
      { id:'w2', name:'wave-2', kind:'coord', task:'wave-2', live:true, status:'working',
        children:[
          { id:'pricing', name:'pricing', kind:'leaf', task:'pricing', live:true, status:'working', elapsed:'1h' },
        ]},
      { id:'smoke', name:'smoke', kind:'leaf', task:'smoke', live:true, status:'idle', elapsed:'2h' },
    ]},
  { id:'bp', name:'BIG PROJECT', kind:'coord', root:true, task:'bp-coord', live:true, status:'working',
    children:[
      { id:'p1', name:'phase-1', kind:'coord', task:'phase-1', live:true, status:'working',
        children:[
          { id:'p1-build', name:'p1-build', kind:'leaf', task:'p1-build', live:true, status:'working', elapsed:'3m' },
          { id:'p1-test',  name:'p1-test',  kind:'leaf', task:'p1-test',  live:true, status:'attn', attn:true, elapsed:'18m' },
        ]},
      { id:'p2', name:'phase-2', kind:'leaf', task:'phase-2', live:true, status:'idle', elapsed:'1h' },
    ]},
  { id:'docs', name:'docs-site', kind:'coord', root:true, task:'docs-coord', live:true, status:'idle', children:[] }, // coord with no team (2b)
];
const freelancers = [
  { id:'fl-scratch', name:'scratch-refactor', kind:'freelance', task:'scratch-refactor', live:true, status:'working', elapsed:'40m' },
  { id:'fl-spike',   name:'perf-spike',       kind:'freelance', task:'perf-spike',       live:true, status:'attn', attn:true, elapsed:'5m' },
];

const collapsed = new Set();        // coord ids that are folded
let freelanceOpen = false;          // Freelance section starts collapsed (▸)
let selId = null;

// folders-first child ordering
function ordered(children){
  return [...children].sort((a,b)=> (a.kind==='coord'?0:1) - (b.kind==='coord'?0:1));
}
const parent = {};
(function idx(list,p){ list.forEach(n=>{ parent[n.id]=p; if(n.children) idx(n.children,n); }); })(projects,null);

// ---------------------------------------------------------------- visible rows
function visibleRows(){
  const out=[];
  function walk(node,depth){
    out.push({type:'node', node, depth});
    if(node.kind==='coord' && !collapsed.has(node.id) && node.children){
      ordered(node.children).forEach(c=>walk(c,depth+1));
    }
  }
  projects.forEach(p=>walk(p,0));
  out.push({type:'freehdr', depth:0});
  if(freelanceOpen) freelancers.forEach(f=>out.push({type:'node', node:f, depth:1}));
  return out;
}
function selectableIds(){ return visibleRows().filter(r=>r.type==='node'||r.type==='freehdr')
  .map(r=> r.type==='freehdr' ? '__free__' : r.node.id); }

// ---------------------------------------------------------------- render rail
function iconFor(n){
  if(n.attn) return {g:'?', c:'icon attn'};
  if(n.kind==='coord' && n.root) return {g:'◆', c:'icon proj'};
  if(n.status==='idle') return {g:'○', c:'icon idle'};
  return {g:'☾', c:'icon live'};
}
function renderRail(){
  const rows = visibleRows();
  const html = rows.map(r=>{
    if(r.type==='freehdr'){
      const chev = freelanceOpen?'▾':'▸';
      const sel = selId==='__free__'?' sel':'';
      return `<div class="sep row${sel}" data-id="__free__"><span class="chev">${chev}</span>
        <span class="line"></span><span style="padding:0 6px">Freelance (${freelancers.length})</span><span class="line"></span></div>`;
    }
    const n=r.node, ic=iconFor(n), sel=n.id===selId?' sel':'';
    const isCoord = n.kind==='coord';
    const chev = isCoord ? (collapsed.has(n.id)?'▸':'▾') : '';
    const chevCls = isCoord ? 'chev' : 'chev leaf';
    const nameCls = n.root?'name proj':(isCoord?'name coord':'name');
    const pad = 8 + r.depth*16;
    const pill = (isCoord && !n.root) ? '<span class="pill">coord</span>'
               : (n.kind==='freelance' ? '<span class="pill">freelance</span>' : '');
    const count = (isCoord && n.children && n.children.length) ? `<span class="count">(${n.children.length})</span>` : '';
    return `<div class="row${sel}" data-id="${n.id}" style="padding-left:${pad}px">
        <span class="${chevCls}">${chev}</span><span class="${ic.c}">${ic.g}</span>
        <span class="${nameCls}">${n.name}</span>${count}${pill}
        ${n.elapsed?`<span class="elapsed">${n.elapsed}</span>`:''}</div>`;
  }).join('');
  document.getElementById('rows').innerHTML = html;
  // keep selection in view
  const el = document.querySelector('.row.sel'); if(el) el.scrollIntoView({block:'nearest'});
}

// ---------------------------------------------------------------- fake PTY
function pty(node, asCoord){
  if(!node) return '';
  const c = (cls,t)=>`<span class="${cls}">${t}</span>`;
  if(node.kind==='freelance'){
    return `${c('d','$ claude  (freelance · unmanaged by hera)')}
${c('a','I scoped the refactor — 3 files touched, tests still green.')}
${node.attn ? c('warn','\n❯ 1. Apply the change   2. Show diff first') : c('d','…running')} <span class="cursor"></span>`;
  }
  if(asCoord){
    const team = (node.children||[]).map(x=>x.name).join(', ') || '(no workers yet)';
    return `${c('d',`# coordinator · ${node.name}`)}
${c('a',`Dispatching work across: ${team}`)}
${c('u','> ')}${c('a','status?')}
${c('d',`  ${ (node.children||[]).length } worker(s) bound. waiting on replies…`)} <span class="cursor"></span>`;
  }
  // leaf agent
  if(node.attn){
    return `${c('a',`Working ${node.name}. I need a decision before I continue:`)}
${c('warn','\n❯ 1. Yes, rewrite the handler   2. No, keep the shim   3. Explain')}  <span class="cursor"></span>`;
  }
  return `${c('d',`# ${node.name}`)}
${c('a','Implementing the slice. Running the suite now…')}
${c('ok','  ✓ 24 passed')}  ${c('d','(race)')} <span class="cursor"></span>`;
}

function findNode(id){ let r=null; (function w(l){l.forEach(n=>{if(n.id===id)r=n; if(n.children)w(n.children);});})(projects);
  if(!r) r = freelancers.find(f=>f.id===id)||null; return r; }

// ---------------------------------------------------------------- render body
function paneHtml(node, role){
  const ic = iconFor(node);
  const st = node.status==='attn'?'attn':(node.status==='idle'?'idle':'working');
  const stTxt = node.status==='attn'?'needs you':(node.status||'live');
  return `<div class="pane">
    <div class="ph"><span class="${ic.c}">${ic.g}</span><span class="tag">${node.name}</span>
      <span class="role">${role}</span><span class="st ${st}">${stTxt}</span></div>
    <div class="term">${pty(node, role==='coord')}</div></div>`;
}
function renderBody(){
  const body=document.getElementById('bodyEl');
  const bottom=document.getElementById('bottom');
  if(selId==='__free__'){
    body.innerHTML=`<div class="pane"><div class="ph"><span class="tag">Freelance</span><span class="role">unmanaged argus agents</span></div><div class="empty">${freelancers.length} freelancer(s) — press <kbd style="margin:0 4px">space</kbd> to ${freelanceOpen?'collapse':'expand'}, then j/k into them</div></div>`;
    bottom.innerHTML=`<span class="mode solo">SECTION</span><span>Freelance group · <b>${freelancers.length}</b> agents</span><span><kbd>space</kbd> fold</span>`;
    return;
  }
  const n=findNode(selId);
  if(!n){ body.innerHTML=`<div class="pane"><div class="empty">— nothing selected —</div></div>`; return; }
  if(n.kind==='leaf'){
    const coord = parent[n.id];                 // a leaf always sits under a coord
    body.innerHTML = paneHtml(coord,'coord') + paneHtml(n,'agent');
    bottom.innerHTML=`<span class="mode">PAIR</span><span>coord <b>${coord.name}</b> + agent <b>${n.name}</b></span>
      <span>focus: <kbd>RAIL</kbd> → <kbd>COORD</kbd> → <kbd>AGENT</kbd></span>`;
  } else { // coord node OR freelance → solo full-width
    const role = n.kind==='freelance' ? 'freelance' : 'coord';
    body.innerHTML = paneHtml(n, role);
    const why = n.kind==='freelance' ? 'freelancer' : (n.children&&n.children.length? 'coord (agent view cleared)':'coord · no team');
    bottom.innerHTML=`<span class="mode solo">SOLO</span><span><b>${n.name}</b> — ${why}, full width</span>
      <span>focus: <kbd>RAIL</kbd> ↔ <kbd>PANE</kbd></span>`;
  }
}

function render(){ renderRail(); renderBody(); }

// ---------------------------------------------------------------- navigation
function move(dir){
  const ids=selectableIds(); if(!ids.length) return;
  let i=ids.indexOf(selId);
  if(i<0){ selId=ids[0]; render(); return; }
  i=Math.max(0,Math.min(ids.length-1,i+dir));
  selId=ids[i]; render();
}
function toggleFold(){
  if(selId==='__free__'){ freelanceOpen=!freelanceOpen; render(); return; }
  const n=findNode(selId);
  if(n && n.kind==='coord' && n.children && n.children.length){
    if(collapsed.has(n.id)) collapsed.delete(n.id); else collapsed.add(n.id);
    render();
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); move(1); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggleFold(); }
});
document.getElementById('rows').addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const id=row.dataset.id;
  if(id==='__free__'){ selId='__free__'; render(); return; }
  selId=id; render();
});

// initial selection: first LEAF agent in DFS (folders-first) → lands you in pair view
(function initSel(){
  let found=null;
  (function w(list){ for(const n of ordered(list)){ if(found)return;
    if(n.kind==='leaf'){found=n.id;return;} if(n.children)w(n.children); } })(projects);
  selId = found || projects[0].id;
})();
render();
document.getElementById('rail').focus();
</script>
</body>
</html>
